name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include the Android SDK and sdkmanager.
      # Avoid android-actions/setup-android@v3: its legacy "tools" package no longer exists.
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.DEEPTUTOR_SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/deeptutor-signing.jks"
          test -s "$RUNNER_TEMP/deeptutor-signing.jks"
      - name: Fetch official DeepTutor app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/HKUDS/DeepTutor/main/web/public/apple-touch-icon.png" \
            --output app/src/main/res/drawable-nodpi/deeptutor_icon.png
          file app/src/main/res/drawable-nodpi/deeptutor_icon.png
      - name: Build debug APK
        env:
          SIGNING_KEY_AVAILABLE: ${{ secrets.DEEPTUTOR_SIGNING_KEY_BASE64 != '' }}
          DEEPTUTOR_STORE_PASSWORD: ${{ secrets.DEEPTUTOR_STORE_PASSWORD }}
          DEEPTUTOR_KEY_ALIAS: ${{ secrets.DEEPTUTOR_KEY_ALIAS }}
          DEEPTUTOR_KEY_PASSWORD: ${{ secrets.DEEPTUTOR_KEY_PASSWORD }}
        run: |
          if [ "$SIGNING_KEY_AVAILABLE" != "true" ]; then
            echo "::error::Persistent signing key is not configured. Add the DEEPTUTOR_* repository secrets."
            exit 1
          fi
          export DEEPTUTOR_KEYSTORE_PATH="$RUNNER_TEMP/deeptutor-signing.jks"
          gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deeptutor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
